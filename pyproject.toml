[build-system]
requires = ["setuptools>=77", "packaging>=24.2"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-pipeline"
version = "0.1.0"
description = "多 Agent 代码开发流水线提示词工程与校验工具"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["multi-agent", "prompt", "pipeline", "code-review", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy", "pytest-cov"]

[project.scripts]
agent-pipeline = "agent_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/agent-pipeline/prompts" = ["prompts/*.md"]
"share/agent-pipeline/templates" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=agent_pipeline --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
strict = true

[tool.coverage.run]
source = ["agent_pipeline"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
